<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Formal dossier portrait placeholder</title>
  <desc id="desc">A monochrome placeholder portrait card with a formal bust silhouette and archival markings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#10222b" />
      <stop offset="100%" stop-color="#081319" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7e6e1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8fdbc9" stop-opacity="0.04" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)" />
  <rect x="40" y="40" width="720" height="920" fill="url(#panel)" stroke="#8fdbc9" stroke-opacity="0.18" />
  <rect x="64" y="64" width="672" height="872" fill="none" stroke="#d7e6e1" stroke-opacity="0.1" />
  <g opacity="0.14">
    <path d="M80 180H720" stroke="#8fdbc9" stroke-width="1" />
    <path d="M80 500H720" stroke="#8fdbc9" stroke-width="1" />
    <path d="M80 820H720" stroke="#8fdbc9" stroke-width="1" />
    <path d="M180 80V920" stroke="#8fdbc9" stroke-width="1" />
    <path d="M400 80V920" stroke="#8fdbc9" stroke-width="1" />
    <path d="M620 80V920" stroke="#8fdbc9" stroke-width="1" />
  </g>
  <g fill="#d7e6e1" fill-opacity="0.78">
    <circle cx="400" cy="332" r="118" />
    <path d="M274 528c34-38 75-61 126-61s92 23 126 61l42 157H232l42-157Z" />
    <path d="M248 746c41 54 89 84 152 84s111-30 152-84v98H248v-98Z" fill-opacity="0.42" />
  </g>
  <g fill="none" stroke="#071218" stroke-opacity="0.55">
    <circle cx="400" cy="332" r="118" />
    <path d="M274 528c34-38 75-61 126-61s92 23 126 61l42 157H232l42-157Z" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" text-transform="uppercase">
    <text x="96" y="118" fill="#d7e6e1" fill-opacity="0.9" font-size="28" letter-spacing="6">Personnel Portrait</text>
    <text x="96" y="154" fill="#91aca9" font-size="16" letter-spacing="4">Verified Placeholder Asset</text>
    <text x="96" y="892" fill="#8fdbc9" fill-opacity="0.7" font-size="18" letter-spacing="5">Archive Record // Subject Visual Pending</text>
    <text x="96" y="920" fill="#91aca9" fill-opacity="0.75" font-size="14" letter-spacing="3">Limited release formal silhouette for classified dossier presentation</text>
  </g>
  <rect width="800" height="1000" fill="#ffffff" filter="url(#grain)" opacity="0.25" />
</svg>
